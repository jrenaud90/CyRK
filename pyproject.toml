[project]
name='CyRK'
version = '0.18.2'
description='Runge-Kutta ODE Integrator Implemented in Cython and Numba.'
authors= [
    {name = 'Joe P. Renaud', email = 'joe.p.renaud@gmail.com'}
    ]
requires-python = ">=3.9,<3.15"
dependencies = [
    'numba >= 0.54.1',
    'numpy >= 1.22, <2.6',
    'scipy >= 1.9.3'
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
keywords = [
    'Scientific Computing',
    'Runge-Kutta',
    'Numerical Integration',
    'ODEs',
    'Ordinary Differential Equations',
    'cython',
    'numba',
    'Integration'
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
"Homepage" = "https://github.com/jrenaud90/CyRK"
"Bug Tracker" = "https://github.com/jrenaud90/CyRK/issues"
"Documentation" = "https://cyrk.readthedocs.io/en/latest/"


[project.optional-dependencies]
# As of August, 2023 - the latest version of line_profiler does not track cython functions. Using older vers.
dev = [
    "jupyter",
    "matplotlib",
    "pytest",
    "timeit",
    "line_profiler==3.5.1"
]

docs = [
    "sphinx",
    "myst-parser",
    "linkify-it-py",
    "sphinx_rtd_theme",
    "toml",
    "sphinx-copybutton",
    "nbsphinx",
    "ipykernel",
    "nbconvert",
    "jupyter",
    "sphinx-autodoc-typehints",
    "furo",
    "breathe",
    "jupyter",
    "pytest",
    "matplotlib>=3.4.2",
]

# The extension modules are declared in setup.py (setuptools has no pyproject.toml equivalent for them).
[build-system]
requires = [
    'setuptools>=64.0.0',
    'numpy >= 1.22, <2.6',
    'cython>=3.0.0',
    'wheel>=0.38'
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# The trailing "*" matters. Setuptools treats directories without an __init__.py as namespace
# packages here, so "Tests" on its own leaves "Tests.A_Package_Tests" and friends in the wheel,
# which then installs a top level "Tests" into the user's site-packages.
exclude = ["Tests*", "Demos*", "Benchmarks*", "Documentation*", "Performance*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = [
    "Tests"
]

# Binary wheel builds (see .github/workflows/build_wheels_main_pypi.yml). Each wheel is built, repaired (auditwheel,
# delvewheel, or delocate bundle any non-system libraries it links to), and then tested in a fresh environment.
[tool.cibuildwheel]
build = "*"
# No PyPy or musl wheels. Free-threaded CPython (the "t" builds) is skipped because numba, a hard dependency, does
# not ship free-threaded wheels.
skip = ["pp*", "*musl*", "cp3??t-*"]
# Having issues with SciPy install during wheel build on 32-bit systems.
archs = ["auto64"]
# Import the installed wheel and run CyRK's built-in solver checks (numba, PySolver, CySolver, nbsolve2).
test-command = 'python -c "import CyRK; CyRK.test_nbrk(); CyRK.test_cysolver(); CyRK.test_pysolver(); CyRK.test_nbsolver()"'

[tool.cibuildwheel.macos]
# The oldest macOS supported by numba's and scipy's arm64 wheels; also what the previous CyRK wheels targeted.
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }
